<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearTask - Login</title>
    <!-- Importação de ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Secção Esquerda -->
        <div class="left-section">
            <div class="logo">
                <i class="fa-solid fa-square-check logo-icon"></i>
                <h1>ClearTask</h1>
            </div>
            <p class="subtitle">Organize suas tarefas,<br>conquiste seus objetivos.</p>
            <div class="mountain-graphic">
                <!-- Representação minimalista das montanhas -->
                <svg viewBox="0 0 100 50" fill="none" stroke="#6373f1" stroke-width="1.5">
                    <path d="M15,45 L35,25 L45,35 L65,15 L95,45" />
                    <path d="M35,25 L45,35" stroke="#475569" />
                </svg>
            </div>
        </div>

        <!-- Secção Direita (Formulário) -->
        <div class="right-section">
            <div class="login-card">
                <h2>Bem-vindo de volta!</h2>
                <p class="login-subtitle">Faça login para continuar</p>

                <form action="/login" method="POST">
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" name="username" placeholder="E-mail ou usuário" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Senha" required>
                        <i class="fa-regular fa-eye toggle-password"></i>
                    </div>

                    <button type="submit" class="btn-login">Entrar</button>
                </form>

                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="register-text">Não tem uma conta? <a href="/register">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</body>
</html>
