<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearTask - Registo</title>
    <!-- Importação de ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Reutilização do ficheiro CSS do Login -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Secção Esquerda (Idêntica à do Login) -->
        <div class="left-section">
            <div class="logo">
                <i class="fa-solid fa-square-check logo-icon"></i>
                <h1>ClearTask</h1>
            </div>
            <p class="subtitle">Organize suas tarefas,<br>conquiste seus objetivos.</p>
            <div class="mountain-graphic">
                <svg viewBox="0 0 100 50" fill="none" stroke="#6373f1" stroke-width="1.5">
                    <path d="M15,45 L35,25 L45,35 L65,15 L95,45" />
                    <path d="M35,25 L45,35" stroke="#475569" />
                </svg>
            </div>
        </div>

        <!-- Secção Direita (Formulário de Registo) -->
        <div class="right-section">
            <div class="login-card">
                <h2>Crie sua conta</h2>
                <p class="login-subtitle">É rápido e fácil!</p>

                <form action="/create_user" method="POST">
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input
    type="text"
    name="name"
    placeholder="Nome de usuário"
    value="{{ name or '' }}"
    required>
                    </div>

                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input
    type="email"
    name="email"
    placeholder="E-mail"
    value="{{ email or '' }}"
    required
>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="Senha" required>
                        <i class="fa-regular fa-eye toggle-password"></i>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirm_password" placeholder="Confirmar senha" required>
                        <i class="fa-regular fa-eye toggle-password"></i>
                    </div>
                    {% if error %}
                        <p class="error">{{ error }}</p>
                    {% endif %}
                    <button type="submit" class="btn-login">Cadastrar</button>
                </form>

                <!-- Espaçamento extra em vez do divisor "ou" que havia no login -->
                <div style="margin-top: 1.5rem;"></div>

                <p class="register-text">Já tem uma conta? <a href="/login">Faça login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
